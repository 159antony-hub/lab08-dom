<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarea - Lista de tareas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 30px auto; padding: 0 12px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; border: 1px solid #ccc; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
    li.hecha { text-decoration: line-through; color: #888; background: #f3f3f3; }
    li button { margin-left: 10px; }
    .error { color: #c0392b; }
    .ok { color: #1e8449; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1 id="titulo">Lista de tareas</h1>

  <form id="formTarea">
    <input id="textoTarea" type="text" maxlength="60" placeholder="Nueva tarea">
    <button type="submit">Agregar</button>
    <br>
    <small id="contadorCaracteres">0 / 60</small>
  </form>
  <p id="mensaje"></p>

  <ul id="lista"></ul>
  <p>Pendientes: <span id="pendientes">0</span></p>
  <p><small>Haz clic en una tarea para marcarla como hecha.</small></p>

  <script src="app.js"></script>
</body>
</html>
